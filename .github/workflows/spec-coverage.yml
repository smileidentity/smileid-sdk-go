name: spec-coverage
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Checks spec-coverage.json against the whole public spec at its spec_tag.
  # spec_coverage_test.go checks the file against the code.
  spec-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: smileidentity/central-workflows/.github/actions/spec-coverage@cccc8dc1eea22671b2ad4c0ca15f03980a1879e0 # main
