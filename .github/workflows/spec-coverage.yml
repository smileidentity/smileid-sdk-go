name: spec-coverage
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Checks spec-coverage.json against the whole public spec at its spec_tag.
  # spec_coverage_test.go checks the file against the code.
  spec-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: smileidentity/central-workflows/.github/actions/spec-coverage@49a78637405548038aff983d4cdf7c37eba655b4 # spec-coverage-check branch; move to main after central-workflows merges it
