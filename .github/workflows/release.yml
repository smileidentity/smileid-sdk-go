name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Fail fast on a bad tag before spending CI minutes on the full suite.
  guard:
    if: github.repository == 'smileidentity/smileid-sdk-go'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Earlier release tags, for the breaking-change check.
          fetch-depth: 0
      - name: Verify tag is a valid semver matching the module's major version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a valid semver tag (expected vX.Y.Z)"
            exit 1
          fi
          TAG_MAJOR="${BASH_REMATCH[1]}"
          MODULE=$(awk '$1=="module"{print $2; exit}' go.mod)
          if [ -z "$MODULE" ]; then
            echo "::error::Could not find a 'module' directive in go.mod"
            exit 1
          fi
          # A module path only carries a /vN suffix for major version 2+; v0 and v1 have none.
          MODULE_SUFFIX=$(echo "$MODULE" | grep -oE '/v[0-9]+$' | grep -oE '[0-9]+' || true)
          if [ -n "$MODULE_SUFFIX" ]; then
            if [ "$TAG_MAJOR" != "$MODULE_SUFFIX" ]; then
              echo "::error::Tag major version v$TAG_MAJOR does not match module path '$MODULE' (expected v$MODULE_SUFFIX.x.y). A mismatched tag would break consumers importing that major version."
              exit 1
            fi
          elif [ "$TAG_MAJOR" != "0" ] && [ "$TAG_MAJOR" != "1" ]; then
            echo "::error::Tag major version v$TAG_MAJOR requires module path '$MODULE' to end with /v$TAG_MAJOR. A mismatched tag would break consumers importing that major version."
            exit 1
          fi
      - name: Verify CHANGELOG.md has an entry for this version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! grep -qE "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## [$VERSION] - YYYY-MM-DD' heading for tag '$TAG'"
            exit 1
          fi
      - name: Verify sdkVersion matches the tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SDK_VERSION=$(sed -nE 's/^[[:space:]]*sdkVersion = "([^"]+)"$/\1/p' transport.go)
          if [ "$SDK_VERSION" != "$VERSION" ]; then
            echo "::error::sdkVersion in transport.go is '$SDK_VERSION' but the tag is '$GITHUB_REF_NAME'. Run scripts/bump-version.sh before tagging."
            exit 1
          fi
      - name: Verify the major version matches the breaking PRs since the last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # The highest v* tag below this one.
          PREV=$(git tag --list 'v*' --sort=version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            awk -v tag="$TAG" '$0 == tag { exit } { prev = $0 } END { print prev }')
          if [ -z "$PREV" ]; then
            echo "::notice::No earlier release tag, so there are no breaking PRs to check."
            exit 0
          fi
          SINCE=$(git for-each-ref --format='%(creatordate:iso-strict)' "refs/tags/$PREV")
          BREAKING=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state merged --label breaking \
            --search "merged:>=$SINCE" --limit 100 --json number,title --jq '.[] | "#\(.number) \(.title)"')
          PREV_MAJOR=$(echo "${PREV#v}" | cut -d. -f1)
          TAG_MAJOR=$(echo "${TAG#v}" | cut -d. -f1)
          echo "Previous release: $PREV ($SINCE)"
          if [ -n "$BREAKING" ]; then
            echo "PRs labelled breaking merged since $PREV:"
            echo "$BREAKING"
          fi
          if [ -n "$BREAKING" ] && [ "$TAG_MAJOR" -le "$PREV_MAJOR" ]; then
            echo "::error::PRs labelled breaking merged since $PREV, so $TAG must be a new major version."
            exit 1
          fi
          if [ -z "$BREAKING" ] && [ "$TAG_MAJOR" -gt "$PREV_MAJOR" ]; then
            echo "::error::$TAG is a major release, but no PR labelled breaking merged since $PREV. Label the PR that needs it, or release a minor or patch version."
            exit 1
          fi

  # Reuse the same build/test/gofmt/vet/lint job the test workflow runs on
  # every push, so a release never ships code that hasn't passed CI.
  test:
    needs: guard
    if: github.repository == 'smileidentity/smileid-sdk-go'
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    if: github.repository == 'smileidentity/smileid-sdk-go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
