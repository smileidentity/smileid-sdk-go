name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Fail fast on a bad tag before spending CI minutes on the full suite.
  guard:
    if: github.repository == 'smileidentity/smileid-sdk-go'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Verify tag is a valid semver matching the module's major version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a valid semver tag (expected vX.Y.Z)"
            exit 1
          fi
          TAG_MAJOR="${BASH_REMATCH[1]}"
          MODULE=$(awk 'NR==1{print $2}' go.mod)
          # A module path only carries a /vN suffix for major version 2+; v0/v1 have none.
          MODULE_MAJOR=$(echo "$MODULE" | grep -oE '/v[0-9]+$' | grep -oE '[0-9]+' || echo 1)
          if [ "$TAG_MAJOR" != "$MODULE_MAJOR" ]; then
            echo "::error::Tag major version v$TAG_MAJOR does not match module path '$MODULE' (expected v$MODULE_MAJOR.x.y). A mismatched tag would break consumers importing that major version."
            exit 1
          fi

  # Reuse the same build/test/gofmt/vet/lint job the test workflow runs on
  # every push, so a release never ships code that hasn't passed CI.
  test:
    needs: guard
    if: github.repository == 'smileidentity/smileid-sdk-go'
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    if: github.repository == 'smileidentity/smileid-sdk-go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
