name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Fail fast on a bad tag before spending CI minutes on the full suite.
  guard:
    if: github.repository == 'smileidentity/smileid-sdk-go'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Earlier release tags, for the breaking-change check.
          fetch-depth: 0
      # The same guards run on release PRs in quality-gates.yml, so a bad
      # release fails there before the tag is pushed and the version is burnt.
      - name: Verify the tag, CHANGELOG, sdkVersion and breaking PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-release.sh "${GITHUB_REF_NAME}"

  # Reuse the same build/test/gofmt/vet/lint job the test workflow runs on
  # every push, so a release never ships code that hasn't passed CI.
  test:
    needs: guard
    if: github.repository == 'smileidentity/smileid-sdk-go'
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    if: github.repository == 'smileidentity/smileid-sdk-go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
