name: Security Audit

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read
  issues: write

env:
  # Pinned so a govulncheck release cannot change the result. Dependabot
  # does not bump it, so update it by hand.
  GOVULNCHECK_VERSION: v1.10.0

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: Run govulncheck
        run: govulncheck ./...
      - name: Create issue on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label "security-audit" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then exit 0; fi
          TITLE_DATE=$(date +%Y-%m-%d)
          gh label create "security-audit" --description "Automated security audit" --color "D93F0B" 2>/dev/null || true
          gh label create "priority:high" --description "High priority" --color "B60205" 2>/dev/null || true
          gh issue create \
            --title "Security: Go dependency vulnerabilities detected (${TITLE_DATE})" \
            --label "security-audit" \
            --label "priority:high" \
            --body "The daily security audit has detected vulnerabilities. See [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
