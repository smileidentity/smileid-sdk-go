version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    rules:
      # Test HTTP handlers write fixed response bodies; the write error is not
      # meaningful in an httptest server.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
